plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
	maven {
		name = "GuiLib"
		url = "https://skyblockoverhaul.github.io/maven"
		content { includeGroup "net.sbo" }
	}
	// JEI (optional recipe viewer integration, compile-time API only; see client/compat/JugcraftJeiPlugin).
	maven {
		name = "BlameJared"
		url = "https://maven.blamejared.com"
		content {
			includeGroup "mezz.jei"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"jugcraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// One reviewed list controls the development classpaths, pack downloads, and release metadata.
def frameworkLockFile = file("distribution/frameworks.lock.json")
def frameworkLock = new groovy.json.JsonSlurper().parse(frameworkLockFile)
if (frameworkLock.minecraft != project.minecraft_version || frameworkLock.fabricLoader != project.loader_version
		|| frameworkLock.kotlin != project.kotlin_version) {
	throw new GradleException("Platform pins disagree with distribution/frameworks.lock.json")
}
def withOptionalIntegrations = providers.gradleProperty("jugcraftOptionalIntegrations").getOrElse("true").toBoolean()

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Only the API: Jugcraft runs without JEI; with it, JEI loads our plugin (entrypoint "jei_mod_plugin").
	compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
	compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	frameworkLock.dependencies.each { library ->
		// Fabric API and the JEI API already have their established declarations above.
		if (library.key != "fabric-api") {
			boolean clientOnly = library.side == "client"
			if (library.requiredByJugcraft) {
				add(clientOnly ? "clientImplementation" : "implementation", library.maven) { transitive = false }
			} else {
				if (library.key != "jei") {
					add(clientOnly ? "clientCompileOnly" : "compileOnly", library.maven) { transitive = false }
				}
				if (withOptionalIntegrations) {
					add(clientOnly ? "clientRuntimeOnly" : "runtimeOnly", library.maven) { transitive = false }
				}
			}
		}
	}
}

processResources {
	inputs.property "version", project.version
	inputs.file frameworkLockFile

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
	doLast {
		File manifest = new File(destinationDir, "fabric.mod.json")
		def metadata = new groovy.json.JsonSlurper().parse(manifest)
		frameworkLock.dependencies.each { library ->
			if (library.requiredByJugcraft) {
				metadata.depends[library.modId] = ">=${library.modVersion}"
			} else {
				if (!metadata.suggests) metadata.suggests = [:]
				metadata.suggests[library.modId] = ">=${library.modVersion}"
			}
		}
		manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + "\n"
	}
}

test {
	// src/test holds only compile-time guards (VanillaReferences); the real tests are the game
	// tests below. Gradle 9 fails a test task that discovers none.
	failOnNoDiscoveredTests = false
}

// In-game tests (src/gametest): a headless server runs them as part of `./gradlew build`.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "jugcraft-test"
		enableGameTests = true
		enableClientGameTests = true // Real client with rendering; CI's client jobs run it and keep the screenshots.
		eula = true // Accepts the Minecraft EULA for the test server only.
	}
}

// CI shares the client game tests out between parallel jobs: -PclientTestShard=<n> -PclientTestShards=<count> keeps
// the test mod's client test classes at positions n, n + count, n + 2 * count ... of its list, so every class runs in
// exactly one job. Without the two properties every class runs. Server game tests are never split.
def clientTestShard = providers.gradleProperty("clientTestShard").getOrElse("")
def clientTestShards = providers.gradleProperty("clientTestShards").getOrElse("")
tasks.named("processGametestResources", ProcessResources) {
	inputs.property("clientTestShard", clientTestShard)
	inputs.property("clientTestShards", clientTestShards)
	doLast { task ->
		if (clientTestShard.isEmpty() && clientTestShards.isEmpty()) {
			return
		}
		if (clientTestShard.isEmpty() || clientTestShards.isEmpty()) {
			throw new GradleException("Give both clientTestShard and clientTestShards, or neither")
		}
		int shard = clientTestShard as int
		int shards = clientTestShards as int
		if (shards < 1 || shard < 0 || shard >= shards) {
			throw new GradleException("clientTestShard must be from 0 to clientTestShards - 1, got ${shard} of ${shards}")
		}
		File manifest = new File(task.destinationDir, "fabric.mod.json")
		def json = new groovy.json.JsonSlurper().parse(manifest)
		List<String> all = json.entrypoints["fabric-client-gametest"]
		List<String> mine = (0..<all.size()).findAll { it % shards == shard }.collect { all[it] }
		json.entrypoints["fabric-client-gametest"] = mine
		manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
		task.logger.lifecycle("Client game tests, shard ${shard} of ${shards} (0-based): ${mine.size()} of ${all.size()} classes: ${mine}")
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

kotlin {
	jvmToolchain(25)
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
