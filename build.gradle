plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// JEI (optional recipe viewer integration, compile-time API only; see client/compat/JugcraftJeiPlugin).
	maven {
		name = "BlameJared"
		url = "https://maven.blamejared.com"
		content {
			includeGroup "mezz.jei"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"jugcraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Only the API: Jugcraft runs without JEI; with it, JEI loads our plugin (entrypoint "jei_mod_plugin").
	compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
	compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

test {
	// src/test holds only compile-time guards (VanillaReferences); the real tests are the game
	// tests below. Gradle 9 fails a test task that discovers none.
	failOnNoDiscoveredTests = false
}

// In-game tests (src/gametest): a headless server runs them as part of `./gradlew build`.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "jugcraft-test"
		enableGameTests = true
		enableClientGameTests = true // Real client with rendering; CI's client jobs run it and keep the screenshots.
		eula = true // Accepts the Minecraft EULA for the test server only.
	}
}

// CI shares the client game tests out between parallel jobs: -PclientTestShard=<n> -PclientTestShards=<count> keeps
// the test mod's client test classes at positions n, n + count, n + 2 * count ... of its list, so every class runs in
// exactly one job. Without the two properties every class runs. Server game tests are never split.
def clientTestShard = providers.gradleProperty("clientTestShard").getOrElse("")
def clientTestShards = providers.gradleProperty("clientTestShards").getOrElse("")
tasks.named("processGametestResources", ProcessResources) {
	inputs.property("clientTestShard", clientTestShard)
	inputs.property("clientTestShards", clientTestShards)
	doLast { task ->
		if (clientTestShard.isEmpty() && clientTestShards.isEmpty()) {
			return
		}
		if (clientTestShard.isEmpty() || clientTestShards.isEmpty()) {
			throw new GradleException("Give both clientTestShard and clientTestShards, or neither")
		}
		int shard = clientTestShard as int
		int shards = clientTestShards as int
		if (shards < 1 || shard < 0 || shard >= shards) {
			throw new GradleException("clientTestShard must be from 0 to clientTestShards - 1, got ${shard} of ${shards}")
		}
		File manifest = new File(task.destinationDir, "fabric.mod.json")
		def json = new groovy.json.JsonSlurper().parse(manifest)
		List<String> all = json.entrypoints["fabric-client-gametest"]
		List<String> mine = (0..<all.size()).findAll { it % shards == shard }.collect { all[it] }
		json.entrypoints["fabric-client-gametest"] = mine
		manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
		task.logger.lifecycle("Client game tests, shard ${shard} of ${shards} (0-based): ${mine.size()} of ${all.size()} classes: ${mine}")
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
