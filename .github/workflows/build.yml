name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tree-close-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      SDL_VIDEO_FORCE_EGL: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install Mesa
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 mesa-utils xvfb
      - name: Diagnose tree world reopen
        run: |
          mkdir -p build
          ./gradlew runClientGameTest --no-daemon -PclientTests=TreeBatchFiveBCClientGameTests &
          client_build_pid=$!
          (
            while kill -0 "$client_build_pid" 2>/dev/null; do
              sleep 120
              kill -0 "$client_build_pid" 2>/dev/null || break
              for client_jvm_pid in $(pgrep -x java); do
                jcmd "$client_jvm_pid" Thread.print || true
              done
            done
          ) | tee build/ci-tree-threads.log &
          client_diagnostic_pid=$!
          trap 'kill "$client_diagnostic_pid" 2>/dev/null || true' EXIT
          wait "$client_build_pid"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tree-close-diagnostics
          path: |
            build/ci-tree-threads.log
            **/logs/latest.log
            **/screenshots/*.png
