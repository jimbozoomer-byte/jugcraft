name: Build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install data-generation dependencies
        run: python3 -m pip install --quiet pillow numpy
      - name: Check generated JSON is up to date
        run: |
          python3 tools/generate_material_data.py
          git diff --exit-code -- src/main/resources
      - name: Check material data
        run: python3 tools/check_mod_data.py
      - name: Test world designer and pack compiler
        run: node --test tools/world-designer/model.test.cjs
      - name: Build mod
        run: ./gradlew build --no-daemon
      - name: Verify pinned library downloads
        run: python3 scripts/package_modrinth.py verify
      - name: Package Jugcraft Complete
        run: python3 scripts/package_modrinth.py build
      - uses: actions/upload-artifact@v4
        with:
          name: jugcraft-installers
          path: |
            build/libs/*.jar
            build/distributions/*
          if-no-files-found: error

  optional-absent:
    name: optional integrations absent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and run server tests without optional integrations
        run: ./gradlew build --no-daemon -PjugcraftOptionalIntegrations=false

  # A real game client with software rendering (Mesa): runs the client game tests in
  # src/gametest (JugcraftClientGameTests and the rest), which build showrooms and worlds and
  # take screenshots. Three jobs share the test classes out (every third class each, see
  # clientTestShard in build.gradle), so every class runs once; the "client" job below passes
  # only when all three do.
  client-shard:
    name: client (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Mesa (software rendering)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Prepare run directory
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          echo 'preferredGraphicsBackend:"opengl"' > run/options.txt
      - name: Run client game tests (shard ${{ matrix.shard }} of 3)
        run: ./gradlew runClientGameTest --no-daemon -PclientTestShard=${{ matrix.shard }} -PclientTestShards=3
      - name: Print small previews of the screenshots
        if: always()
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, glob, io, os
          from PIL import Image
          for path in sorted(glob.glob("**/screenshots/*.png", recursive=True)):
              image = Image.open(path).convert("RGB")
              image.thumbnail((480, 270))
              buffer = io.BytesIO()
              image.save(buffer, "JPEG", quality=60)
              print(f"=== SCREENSHOT {os.path.basename(path)} {image.size}")
              print(base64.b64encode(buffer.getvalue()).decode())
              print("=== END")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-screenshots-${{ matrix.shard }}
          path: '**/screenshots/*.png'

  # The client game tests' result: green only when every shard ran and passed.
  client:
    needs: client-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every client test shard passed
        env:
          RESULT: ${{ needs.client-shard.result }}
        run: |
          echo "Client test shards: $RESULT"
          test "$RESULT" = success
