name: Build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      load_card:
        description: Also run the Concordance workshop load card (docs/TESTING.md); ordinary runs never do
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: jugcraft-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install data-generation dependencies
        run: python3 -m pip install --quiet pillow numpy
      - name: Check generated JSON is up to date
        run: |
          python3 tools/generate_material_data.py
          git diff --exit-code -- src/main/resources
      - name: Check material data
        run: python3 tools/check_mod_data.py
      - name: Test world designer and pack compiler
        run: node --test tools/world-designer/model.test.cjs
      - name: Build mod
        run: ./gradlew build --no-daemon
      - name: Verify pinned library downloads
        run: python3 scripts/package_modrinth.py verify
      - name: Package Jugcraft Complete
        run: python3 scripts/package_modrinth.py build
      - uses: actions/upload-artifact@v4
        with:
          name: jugcraft-installers
          path: |
            build/libs/*.jar
            build/distributions/*
          if-no-files-found: error

  optional-absent:
    name: optional integrations absent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and run server tests without optional integrations
        run: ./gradlew build --no-daemon -PjugcraftOptionalIntegrations=false

  # Concordance Chunk C, C-10 (C-P20, C-P66): the measured small workshop, only when a manual run asks for it. Fabric's
  # filter makes it the only server game test in its own job; its lines are repeated as one notice on the run.
  load-card:
    name: workshop load card
    if: github.event_name == 'workflow_dispatch' && inputs.load_card
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run the workshop load card
        env:
          JAVA_TOOL_OPTIONS: -Dfabric-api.gametest.filter=jugcraft-test:concordance_workshop_load_game_tests_load_card
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee gametest.out
      - name: Show the load card as a notice
        if: always()
        run: |
          grep -F 'Concordance load card |' gametest.out | sed 's/^.*Concordance load card | //' > card.txt || true
          if [ -s card.txt ]; then
            echo "::notice title=Concordance load card::$(awk '{gsub(/%/, "%25"); printf "%s%%0A", $0}' card.txt)"
          fi

  # Which client game test classes to run, shared out between five client jobs (tools/select_client_tests.py).
  # A pull request runs the classes that show what it changed; main and a manual run of this workflow run them all.
  plan:
    name: choose client tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shard0: ${{ steps.choose.outputs.shard0 }}
      shard1: ${{ steps.choose.outputs.shard1 }}
      shard2: ${{ steps.choose.outputs.shard2 }}
      shard3: ${{ steps.choose.outputs.shard3 }}
      shard4: ${{ steps.choose.outputs.shard4 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Choose the client test classes
        id: choose
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # The pull request's merge commit against its first parent, the base branch.
            python3 tools/select_client_tests.py --base HEAD^1 --shards 5 --github-output "$GITHUB_OUTPUT"
          else
            python3 tools/select_client_tests.py --all --shards 5 --github-output "$GITHUB_OUTPUT"
          fi

  # A real game client with software rendering (Mesa): runs the chosen client game tests in src/gametest
  # (JugcraftClientGameTests and the rest), which build showrooms and worlds and take screenshots. Five jobs share
  # them out (the plan job above), so every chosen class runs once; the "client" job below passes only when the plan
  # and all five do. A job with no classes passes at once.
  client-shard:
    name: client (shard ${{ matrix.shard }} of 5)
    needs: plan
    runs-on: ubuntu-24.04
    # Running every class takes a job 20 to 30 minutes; the limit leaves room for that to grow.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      CLASSES: ${{ needs.plan.outputs[format('shard{0}', matrix.shard)] }}
      LIBGL_ALWAYS_SOFTWARE: 'true'
      # SDL 3 uses EGL for the software OpenGL context; Xvfb's GLX visual selection fails here.
      # https://wiki.libsdl.org/SDL3/SDL_HINT_VIDEO_FORCE_EGL
      SDL_VIDEO_FORCE_EGL: '1'
    steps:
      - name: Classes for this job
        run: |
          echo "Client test classes: ${CLASSES:-none}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: env.CLASSES != ''
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        if: env.CLASSES != ''
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install Mesa (software rendering)
        if: env.CLASSES != ''
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 mesa-utils xvfb
      - name: Prepare run directory
        if: env.CLASSES != ''
        run: |
          # Test options are written by runClientGameTest after Loom cleans its run directory.
          mkdir -p run
          echo "eula=true" > run/eula.txt
      - name: Run client game tests (shard ${{ matrix.shard }} of 5)
        if: env.CLASSES != ''
        run: ./gradlew runClientGameTest --no-daemon "-PclientTests=$CLASSES"
      - name: Print small previews of the screenshots
        if: always() && env.CLASSES != ''
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, glob, io, os
          from PIL import Image
          for path in sorted(glob.glob("**/screenshots/*.png", recursive=True)):
              image = Image.open(path).convert("RGB")
              image.thumbnail((480, 270))
              buffer = io.BytesIO()
              image.save(buffer, "JPEG", quality=60)
              print(f"=== SCREENSHOT {os.path.basename(path)} {image.size}")
              print(base64.b64encode(buffer.getvalue()).decode())
              print("=== END")
          PY
      - uses: actions/upload-artifact@v4
        if: always() && env.CLASSES != ''
        with:
          name: client-screenshots-${{ matrix.shard }}
          path: '**/screenshots/*.png'

  # The client game tests' result: green only when the plan and every shard ran and passed.
  client:
    needs: [plan, client-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every client test shard passed
        env:
          PLAN: ${{ needs.plan.result }}
          RESULT: ${{ needs.client-shard.result }}
        run: |
          echo "Choosing the client tests: $PLAN; client test shards: $RESULT"
          test "$PLAN" = success && test "$RESULT" = success
