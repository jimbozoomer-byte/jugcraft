name: Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          set +e
          ./gradlew compileGametestJava --no-daemon > compile.txt 2>&1
          echo "exit $?"
          grep -E "error:|\.java:[0-9]+: error" -A4 compile.txt | head -300
          tail -20 compile.txt
      - run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-client*deobf-26.3.jar' | head -1)
          CP="$CLIENT:$COMMON"
          l() { echo "=== $1"; javap -cp "$CP" -p "$1" 2>&1 | grep -iE "${2:-.}" | head -${3:-60}; }
          l net.minecraft.world.item.crafting.TransmuteResult
          l net.minecraft.world.item.crafting.TransmuteRecipe 'TransmuteRecipe[(]|CODEC|result'
          mkdir -p van && cd van && unzip -q -o "$COMMON" 'data/minecraft/recipe/*shulker_box*' 'data/minecraft/tags/block/flower_pots.json' 'data/minecraft/tags/block/small_flowers.json' 'data/minecraft/tags/item/small_flowers.json' 'data/minecraft/tags/block/bee_attractive.json' 'assets/minecraft/blockstates/lantern.json' 'assets/minecraft/models/block/template_lantern.json' 'assets/minecraft/items/lantern.json' 'data/minecraft/loot_table/blocks/lantern.json' 'data/minecraft/worldgen/placed_feature/flower_plains.json' 'data/minecraft/worldgen/configured_feature/flower_plain.json' 'data/minecraft/worldgen/configured_feature/flower_flower_forest.json' 2>/dev/null
          for f in data/minecraft/recipe/red_shulker_box.json data/minecraft/tags/block/flower_pots.json data/minecraft/tags/block/small_flowers.json data/minecraft/tags/block/bee_attractive.json assets/minecraft/blockstates/lantern.json assets/minecraft/models/block/template_lantern.json assets/minecraft/items/lantern.json data/minecraft/loot_table/blocks/lantern.json data/minecraft/worldgen/configured_feature/flower_plain.json data/minecraft/worldgen/placed_feature/flower_plains.json; do echo "=== $f"; head -c 2500 $f; echo; done
          ls data/minecraft/worldgen/configured_feature/ | head -30
