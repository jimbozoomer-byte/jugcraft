name: Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew compileGametestJava --no-daemon -q
      - run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-client*deobf-26.3.jar' | head -1)
          GAMETEST=$(find ~/.gradle /home/runner/work -name 'fabric-client-gametest-api-v1*.jar' 2>/dev/null | grep -v sources | head -1)
          echo "gametest jar: $GAMETEST"
          CP="$CLIENT:$COMMON:$GAMETEST"
          # Prints the bytecode of the methods of a class whose header line matches a regex.
          m() { echo "=== $1 /$2/"; javap -cp "$CP" -c -p "$1" 2>&1 | awk -v re="$2" '/^  [a-z].*\(/{p=($0 ~ re)} p' | head -${3:-200}; }
          l() { echo "=== $1 (listing)"; javap -cp "$CP" -p "$1" 2>&1 | grep -iE "${2:-.}" | head -${3:-80}; }
          m net.minecraft.client.input.KeyEvent 'shortcutKey|KeyEvent[(]' 80
          echo "=== InputConstants mouse and modifier constants"; javap -cp "$CP" -p -constants com.mojang.blaze3d.platform.InputConstants | grep -E 'MOUSE_BUTTON|MOD_|PRESS|RELEASE'
          echo "=== InputQuirks"; javap -cp "$CP" -p -c net.minecraft.client.input.InputQuirks | grep -A30 'static {}' | grep -E 'sipush|bipush|iconst|putstatic|ldc'
          m net.fabricmc.fabric.impl.client.gametest.TestInputImpl 'pressOrReleaseKey|holdControl|holdKey[(]com' 260
          l com.mojang.blaze3d.platform.InputConstants 'getKey|scancode|keycode|Key[(]' 40
