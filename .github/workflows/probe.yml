name: Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          set +e
          ./gradlew compileClientJava compileGametestJava --no-daemon > compile.txt 2>&1
          echo "exit $?"
          grep -E "error:" -A3 compile.txt | head -300
      - run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-client*deobf-26.3.jar' | head -1)
          FAPI=$(find ~/.gradle/caches -name 'fabric-*rendering-v1*.jar' | grep -v sources | head -3 | tr '\n' ':')
          FENT=$(find ~/.gradle/caches -name 'fabric-object-builder-api*.jar' -o -name 'fabric-particles-v1*.jar' -o -name 'fabric-rendering-v1*.jar' | grep -v sources | tr '\n' ':')
          CP="$CLIENT:$COMMON:$FAPI:$FENT"
          l() { echo "=== $1"; javap -cp "$CP" -p "$1" 2>&1 | grep -v 'lambda\$' | grep -iE "${2:-.}" | head -${3:-80}; }
          GT=$(find ~/.gradle/caches -name 'fabric-gametest-api-v1*.jar' | grep -v sources | head -2 | tr '\n' ':')
          CP="$CP:$GT"
          javap -cp "$CP" -p net.minecraft.world.level.block.AbstractBedBlock 2>&1 | head -60
          javap -cp "$CP" -p 'net.minecraft.client.particle.SingleQuadParticle$Layer' 2>&1 | head -20
          javap -cp "$CP" -p -c net.minecraft.world.item.Items | grep -A14 'String red_bed' | head -30
          javap -cp "$CP" -p net.minecraft.world.attribute.BedRule 2>&1 | head -30
          javap -cp "$CP" -p net.minecraft.world.attribute.EnvironmentAttributes 2>&1 | grep -i bed
          javap -cp "$CP" -p net.minecraft.world.entity.ContainerUser 2>&1 | head -20
          javap -cp "$CP" -p net.minecraft.world.level.block.entity.ContainerOpenersCounter 2>&1 | head -30
          javap -cp "$CP" -p net.minecraft.world.level.block.BedBlock 2>&1 | head -40
          javap -cp "$CP" -p -c net.minecraft.world.level.block.Blocks | grep -B3 -A20 'String red_bed' | head -40
          javap -cp "$CP" -p 'net.minecraft.world.entity.player.Player$BedSleepingProblem' 2>&1 | head -20
          javap -cp "$CP" -p net.minecraft.world.level.block.ButtonBlock 2>&1 | grep -E 'codec|MapCodec|ButtonBlock\(' | head
          javap -cp "$CP" -p net.fabricmc.fabric.api.client.particle.v1.FabricSpriteSet 2>&1 | head
