name: Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew compileGametestJava --no-daemon -q
      - run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-client*deobf-26.3.jar' | head -1)
          GAMETEST=$(find ~/.gradle /home/runner/work -name 'fabric-client-gametest-api-v1*.jar' 2>/dev/null | grep -v sources | head -1)
          echo "gametest jar: $GAMETEST"
          CP="$CLIENT:$COMMON:$GAMETEST"
          # Prints the bytecode of the methods of a class whose header line matches a regex.
          m() { echo "=== $1 /$2/"; javap -cp "$CP" -c -p "$1" 2>&1 | awk -v re="$2" '/^  [a-z].*\(/{p=($0 ~ re)} p' | head -${3:-200}; }
          l() { echo "=== $1 (listing)"; javap -cp "$CP" -p "$1" 2>&1 | grep -iE "${2:-.}" | head -${3:-80}; }
          l net.minecraft.client.gui.screens.Screen 'mouse|click|drag|release|event|input'
          m net.minecraft.client.gui.screens.Screen 'mouseClicked|mouseDragged|mouseReleased'
          l net.minecraft.client.gui.components.events.ContainerEventHandler
          m net.minecraft.client.gui.components.events.ContainerEventHandler 'mouseClicked|mouseDragged|mouseReleased'
          l net.minecraft.client.gui.components.events.AbstractContainerEventHandler
          l net.minecraft.client.input.MouseButtonEvent
          l net.minecraft.client.input.MouseButtonInfo
          l net.minecraft.client.MouseHandler
          m net.minecraft.client.MouseHandler 'onButton|onMove|handleAccumulatedMovement' 400
          l net.minecraft.client.gui.Gui 'screen|mouse|click'
          for c in $(unzip -l "$GAMETEST" | awk '{print $4}' | grep -E '\.class$' | grep -iE 'TestInput|ClientGameTestContextImpl' | sed 's/\.class$//;s#/#.#g'); do
            l "$c"
            m "$c" 'clickScreenButton|setCursorPos|pressMouse|holdMouse|releaseMouse|moveCursor|cursor' 300
          done
