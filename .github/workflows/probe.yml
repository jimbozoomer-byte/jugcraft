name: API probe (temporary, Witching Season)
on:
  push:
    branches: ['claude/crypt-and-ossuary']
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve Minecraft
        run: ./gradlew compileClientJava --no-daemon -q
      - name: Batch 18 client APIs 2
        run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-clientonly-deobf-26.3.jar' | head -1)
          CP="$CLIENT:$COMMON"
          l() { echo "=== $1 /${2:-.}/"; javap -cp "$CP" -p "$1" 2>&1 | grep -v 'lambda\$' | grep -iE "${2:-.}" | head -${3:-60}; }
          m() { echo "=== $1 /$2/ (code)"; javap -cp "$CP" -c -p "$1" 2>&1 | awk -v re="$2" '/^  [a-z].*[(]/{p=($0 ~ re)} p' | grep -E "invoke|getfield|getstatic|^  [a-z]" | head -${3:-80}; }
          l 'net.minecraft.client.renderer.blockentity.BlockEntityRendererProvider$Context'
          l net.minecraft.client.Minecraft 'Equipment|getEntityModels|Paletted|getModelManager|getItemModelResolver|AtlasManager'
          l 'net.minecraft.client.renderer.entity.EntityRendererProvider$Context' 'Equipment|getModelSet|Paletted'
          m net.minecraft.client.renderer.entity.layers.HumanoidArmorLayer 'submit|renderArmorPiece|setPartVisibility' 120
          l net.minecraft.client.renderer.entity.layers.HumanoidArmorLayer
          l net.minecraft.client.model.Model
          l net.minecraft.client.model.EntityModel
          l net.minecraft.client.resources.model.EquipmentClientInfo
          l 'net.minecraft.client.resources.model.EquipmentClientInfo$LayerType'
          l net.minecraft.client.resources.model.EquipmentAssetManager
          l net.minecraft.client.renderer.entity.state.EntityRenderState 'lightCoords|outlineColor|ageInTicks|EntityRenderState\('
          l net.minecraft.client.renderer.entity.state.LivingEntityRenderState 'LivingEntityRenderState\(|yRot|bodyRot|isBaby|scale'
          l net.minecraft.client.renderer.SubmitNodeCollector
          l net.minecraft.client.renderer.blockentity.state.BlockEntityRenderState
          l net.minecraft.client.renderer.entity.ArmorModelSet
          m net.minecraft.client.renderer.entity.ArmorStandRenderer '<init>' 60
