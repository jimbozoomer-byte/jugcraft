name: Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          set +e
          ./gradlew compileClientJava compileGametestJava --no-daemon > compile.txt 2>&1
          echo "exit $?"
          grep -E "error:|warning: \[" -A3 compile.txt | head -300
