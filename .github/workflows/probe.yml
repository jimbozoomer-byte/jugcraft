name: API probe (temporary, festival crops)
on:
  push:
    branches: ['claude/agriculture-festival-crops']
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve Minecraft
        run: ./gradlew compileJava --no-daemon -q
      - name: Stripping users (4)
        run: |
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-client*deobf-26.3.jar' | head -1)
          CP="$CLIENT:$COMMON"
          FAPI=$(find ~/.gradle/caches -name 'fabric-*.jar' -path '*net.fabricmc.fabric-api*' | grep -v sources | tr '\n' ':')
          mkdir -p /tmp/x && cd /tmp/x && unzip -q -o "$COMMON" 'net/*'
          echo "=== classes using STRIPPED_OAK_LOG"; grep -rl --include='*.class' 'STRIPPED_OAK_LOG' net | head -20
          for f in $(grep -rl --include='*.class' 'STRIPPED_OAK_LOG' net | grep -v '/Blocks.class' | head -4); do c=$(echo ${f%.class} | tr '/' '.'); echo "=== $c"; javap -cp "$CP" -p "$c" | head -40; done
          echo "=== classes named Fuel"; find net -name '*Fuel*.class' | head
          echo "=== content registries jar"; J=$(echo $FAPI | tr ':' '\n' | grep content-registries); jar tf "$J" | grep -E '\.class$' | head -60
          J2=$(echo $FAPI | tr ':' '\n' | grep content-registries); for c in $(jar tf "$J2" | grep -E 'api/.*\.class$' | grep -v '\$' | sed 's/\.class$//; s#/#.#g'); do echo "=== $c"; javap -cp "$CP:$FAPI" "$c" | grep -E 'public' | head -8; done
