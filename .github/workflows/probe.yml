name: Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          set +e
          ./gradlew compileGametestJava --no-daemon > compile.txt 2>&1
          echo "exit $?"
          grep -E "error:|\.java:[0-9]+: error" -A4 compile.txt | head -300
          tail -20 compile.txt
      - run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-client*deobf-26.3.jar' | head -1)
          CP="$CLIENT:$COMMON"
          l() { echo "=== $1"; javap -cp "$CP" -p "$1" 2>&1 | grep -iE "${2:-.}" | head -${3:-60}; }
          l net.minecraft.world.level.material.PushReaction
          l 'net.minecraft.world.level.block.state.BlockBehaviour$Properties' 'push|ignitedByLava|noCollision|replaceable'
          javap -cp "$CP" -c -p net.minecraft.world.level.block.Blocks | grep -n -i "pushreaction\|PushReaction" | head -20
          mkdir -p van && cd van && unzip -q -o "$CLIENT" 'assets/minecraft/blockstates/lantern.json' 'assets/minecraft/models/block/template_lantern.json' 'assets/minecraft/models/block/template_hanging_lantern.json' 'assets/minecraft/items/lantern.json' 2>/dev/null
          for f in assets/minecraft/blockstates/lantern.json assets/minecraft/models/block/template_lantern.json assets/minecraft/models/block/template_hanging_lantern.json assets/minecraft/items/lantern.json; do echo "=== $f"; head -c 3000 $f; echo; done
