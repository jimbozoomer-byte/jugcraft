name: API probe
on:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve Minecraft
        run: ./gradlew compileJava --no-daemon -q
      - name: Exosuit APIs
        run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-clientonly-deobf-26.3.jar' | head -1)
          echo "=== Attributes"; javap -cp "$COMMON" net.minecraft.world.entity.ai.attributes.Attributes | grep -iE "ABSORPTION|MOVEMENT_SPEED|STEP|FALL_DAMAGE" 
          echo "=== AttributeInstance"; javap -cp "$COMMON" net.minecraft.world.entity.ai.attributes.AttributeInstance | grep -iE "Modifier|getValue"
          echo "=== LivingEntity"; javap -cp "$COMMON" net.minecraft.world.entity.LivingEntity | grep -iE "getAttribute\(|Absorption|addEffect|removeEffect|getEffect\(|hasEffect|getItemBySlot"
          echo "=== MobEffectInstance"; javap -cp "$COMMON" net.minecraft.world.effect.MobEffectInstance | grep -iE "public net.minecraft.world.effect.MobEffectInstance\(|isAmbient|isVisible|getDuration|showIcon"
          echo "=== MobEffects"; javap -cp "$COMMON" net.minecraft.world.effect.MobEffects | grep -iE "NIGHT_VISION"
          echo "=== Level brightness"; javap -cp "$COMMON" net.minecraft.world.level.Level | grep -iE "getMaxLocalRawBrightness|getRawBrightness|getLightEmission"; javap -cp "$COMMON" net.minecraft.world.level.LevelReader | grep -iE "Brightness"; javap -cp "$COMMON" net.minecraft.world.level.BlockAndTintGetter | grep -iE "Brightness"
          echo "=== Recipe smithing"; javap -cp "$COMMON" net.minecraft.world.item.crafting.SmithingRecipeInput | head; javap -cp "$COMMON" net.minecraft.world.item.crafting.SmithingTransformRecipe | head -20
          javap -cp "$COMMON" net.minecraft.world.item.crafting.RecipeManager | grep -iE "getRecipeFor|byKey"
          javap -cp "$COMMON" net.minecraft.server.level.ServerLevel | grep -iE "recipeAccess"
          javap -cp "$COMMON" net.minecraft.world.item.crafting.RecipeType | grep -iE "SMITHING"
          echo "=== smithing json"; unzip -p "$COMMON" data/minecraft/recipe/netherite_helmet_smithing.json
          echo "=== HumanoidModel"; javap -cp "$CLIENT:$COMMON" net.minecraft.client.model.HumanoidModel | grep -iE "ModelPart"
          echo "=== HumanoidRenderState"; javap -cp "$CLIENT:$COMMON" net.minecraft.client.renderer.entity.state.HumanoidRenderState | grep -iE "Equipment|ItemStack"
          echo "=== ModelPart"; javap -cp "$CLIENT:$COMMON" net.minecraft.client.model.geom.ModelPart | grep -iE "translateAndRotate|visible"
          echo "=== ServerTickEvents"; for J in $(find ~/.gradle/caches -name 'fabric-lifecycle-events*.jar' | grep -v sources | head -1); do javap -cp "$J:$COMMON" net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents | head; javap -cp "$J:$COMMON" 'net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents$EndTick' | head; done
          echo "=== PlayerList"; javap -cp "$COMMON" net.minecraft.server.players.PlayerList | grep -iE "getPlayers"
