name: Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          set +e
          ./gradlew compileClientJava compileGametestJava --no-daemon > compile.txt 2>&1
          echo "exit $?"
          grep -E "error:" -A3 compile.txt | head -300
      - run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-client*deobf-26.3.jar' | head -1)
          CP="$CLIENT:$COMMON"
          l() { echo "=== $1"; javap -cp "$CP" -p "$1" 2>&1 | grep -v 'lambda\$' | grep -iE "${2:-.}" | head -${3:-80}; }
          for f in data/minecraft/villager_trade/wandering_trader/emerald_oak_sapling.json data/minecraft/villager_trade/farmer/2/emerald_apple.json data/minecraft/tags/villager_trade/librarian/level_3.json; do echo "--- $f"; unzip -p "$COMMON" "$f"; echo; done
          unzip -l "$COMMON" | grep -iE "data/minecraft/(trade_set|villager_trade)/[a-z_]+\.json|trade_set" | awk '{print $4}' | head -20
          for f in $(unzip -l "$COMMON" | grep -iE "data/minecraft/trade_set/.*json" | awk '{print $4}' | head -3); do echo "--- $f"; unzip -p "$COMMON" "$f"; echo; done
          unzip -l "$COMMON" | grep -iE "tags/villager_trade/wandering|villager_trade/wandering_trader" | awk '{print $4}' | head -40
          for f in $(unzip -l "$COMMON" | grep -iE "tags/villager_trade/wandering.*json" | awk '{print $4}' | head -3); do echo "--- $f"; unzip -p "$COMMON" "$f"; echo; done
          l net.minecraft.world.item.trading.VillagerTrade '' 40
          l net.minecraft.world.item.trading.TradeSet '' 30
          l net.minecraft.world.item.trading.TradeSets 'public static' 30
          javap -cp "$CP" -c -p net.minecraft.world.entity.npc.wanderingtrader.WanderingTrader | grep -A40 "void updateTrades" | head -50
          javap -cp "$CP" -c -p net.minecraft.world.entity.npc.villager.AbstractVillager | grep -A45 "void addOffersFromTradeSet" | head -50
          l net.minecraft.world.entity.Entity 'getTags|addTag|removeTag|entityTags' 10
          l net.minecraft.world.entity.DropChances 'public' 20
          l net.minecraft.client.gui.Font 'public .* split|public int width|lineHeight|public .* plainSubstrByWidth' 10
          unzip -l "$CLIENT" | grep -iE "renderer/blockentity/.*Sign" | awk '{print $4}'
          javap -cp "$CP" -c -p net.minecraft.client.renderer.blockentity.AbstractSignRenderer | grep -B12 "submitText" | head -60
          l net.minecraft.core.registries.Registries 'TRADE|VILLAGER_TRADE' 5
