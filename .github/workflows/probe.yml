name: Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          set +e
          ./gradlew compileGametestJava --no-daemon > compile.txt 2>&1
          echo "exit $?"
          grep -E "error:|\.java:[0-9]+: error" -A4 compile.txt | head -300
          tail -20 compile.txt
      - run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-client*deobf-26.3.jar' | head -1)
          CP="$CLIENT:$COMMON"
          l() { echo "=== $1"; javap -cp "$CP" -p "$1" 2>&1 | grep -iE "${2:-.}" | head -${3:-60}; }
          javap -cp "$CP" -c -p net.minecraft.world.level.storage.loot.BuiltInLootTables | grep -n -i "carve\|shear" | head -10
          mkdir -p van && cd van && unzip -q -o "$COMMON" 'data/minecraft/loot_table/*carve*' 'data/minecraft/loot_table/blocks/potted_dandelion.json' 'data/minecraft/loot_table/blocks/dandelion.json' 'data/minecraft/loot_table/blocks/lilac.json' 2>/dev/null
          find data -name '*.json' | head; for f in $(find data -name '*.json'); do echo "=== $f"; head -c 2000 $f; echo; done
