name: API probe
on:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve Minecraft
        run: ./gradlew compileJava --no-daemon -q
      - name: Batch 35 APIs
        run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          T=$(find ~/.gradle/caches -name 'fabric-transfer-api-v1*.jar' | grep -v sources | head -1); echo "jar $T"
          unzip -l "$T" | grep -E "item/base|context/" 
          for c in net.fabricmc.fabric.api.transfer.v1.item.base.SingleVariantItemStorage net.fabricmc.fabric.api.transfer.v1.context.ContainerItemContext net.fabricmc.fabric.api.transfer.v1.storage.StorageUtil net.fabricmc.fabric.api.transfer.v1.item.ItemVariant net.fabricmc.fabric.api.transfer.v1.fluid.FluidStorage; do echo "=== $c"; javap -cp "$T:$COMMON" "$c" 2>&1 | head -60; done
          echo "=== Item use"; javap -cp "$COMMON" net.minecraft.world.item.Item | grep -E " use\(| useOn\(|getMaxStackSize|stacksTo"
          echo "=== Items ice"; javap -cp "$COMMON" net.minecraft.world.item.Items | grep -E " ICE;| PACKED_ICE;| BLUE_ICE;| SNOW_BLOCK;| POWDER_SNOW_BUCKET;"
      - name: Batch 34 APIs
        run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-clientOnly-deobf-26.3.jar' | head -1)
          echo "=== PiglinAi"; javap -p -cp "$COMMON" net.minecraft.world.entity.monster.piglin.PiglinAi | grep -iE "armor|gold|safe" 
          echo "=== ItemTags piglin"; javap -cp "$COMMON" net.minecraft.tags.ItemTags | grep -iE "PIGLIN" 
          echo "=== ItemStack"; javap -cp "$COMMON" net.minecraft.world.item.ItemStack | grep -E "enchant|getMaxDamage|setDamageValue|isDamageableItem|copy\(|getEnchantments|isEnchanted" 
          echo "=== Enchantments"; javap -cp "$COMMON" net.minecraft.world.item.enchantment.Enchantments | grep -E " SMITE| SHARPNESS| UNBREAKING"
          echo "=== EnchantmentHelper"; javap -cp "$COMMON" net.minecraft.world.item.enchantment.EnchantmentHelper | grep -E "updateEnchantments|getItemEnchantmentLevel|setEnchantments" 
          echo "=== ItemEnchantments.Mutable"; javap -cp "$COMMON" 'net.minecraft.world.item.enchantment.ItemEnchantments$Mutable' | head -20
          echo "=== DataComponents"; javap -cp "$COMMON" net.minecraft.core.component.DataComponents | grep -E " MAX_DAMAGE| DAMAGE;| ENCHANTMENTS| REPAIR_COST" 
          echo "=== fabric tooltip"; for j in $(find ~/.gradle/caches -name 'fabric-item-api-v1*.jar' | head -3); do unzip -l "$j" | grep -i tooltip; done
          echo "=== fabric livingentity events"; for j in $(find ~/.gradle/caches -name 'fabric-entity-events-v1*.jar' | head -2); do unzip -l "$j" | grep -iE "ServerLivingEntityEvents"; done
          J=$(find ~/.gradle/caches -name 'fabric-entity-events-v1*.jar' | grep -v sources | head -1); javap -cp "$J" 'net.fabricmc.fabric.api.entity.event.v1.ServerLivingEntityEvents$AfterDamage' 'net.fabricmc.fabric.api.entity.event.v1.ServerLivingEntityEvents$AllowDamage' 2>&1 | head
          J2=$(find ~/.gradle/caches -name 'fabric-item-api-v1*.jar' | grep -v sources | head -1); javap -cp "$J2" net.fabricmc.fabric.api.client.item.v1.ItemTooltipCallback 2>&1 | head
          echo "=== LivingEntity undead"; javap -cp "$COMMON" net.minecraft.world.entity.LivingEntity | grep -iE "isInvertedHealAndHarm|undead|getType" | head
          echo "=== mixins dir"; ls src/main/resources/*.mixins.json; cat src/main/resources/*.mixins.json | head -30
      - name: Batch 31 APIs
        run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          for c in net.minecraft.world.item.component.Consumable 'net.minecraft.world.item.component.Consumable$Builder' net.minecraft.world.item.component.Consumables net.minecraft.world.item.component.UseCooldown net.minecraft.world.item.component.UseRemainder net.minecraft.world.item.ItemUseAnimation net.minecraft.world.item.consume_effects.ApplyStatusEffectsConsumeEffect net.minecraft.world.item.consume_effects.RemoveStatusEffectsConsumeEffect net.minecraft.world.item.consume_effects.ClearAllStatusEffectsConsumeEffect net.minecraft.world.effect.MobEffectCategory net.minecraft.world.effect.MobEffects net.minecraft.world.damagesource.DamageSource net.minecraft.world.damagesource.DamageSources net.minecraft.world.damagesource.DamageTypes net.minecraft.tags.DamageTypeTags net.minecraft.tags.EntityTypeTags net.minecraft.world.entity.Mob net.minecraft.world.entity.LivingEntity net.minecraft.world.effect.MobEffectInstance net.minecraft.world.item.equipment.ArmorMaterial net.minecraft.world.level.ServerExplosion net.minecraft.world.entity.AreaEffectCloud net.minecraft.core.particles.ParticleTypes net.minecraft.world.item.Item 'net.minecraft.world.item.Item$Properties' net.minecraft.core.HolderSet net.minecraft.world.entity.ai.targeting.TargetingConditions; do echo "=== $c"; javap -cp "$COMMON" "$c" 2>&1 | grep -vE "^Compiled" | head -120; done
          echo "=== damage_type jsons"; unzip -l "$COMMON" | grep -E "data/minecraft/damage_type/" | head -60
          unzip -p "$COMMON" data/minecraft/damage_type/in_fire.json; unzip -p "$COMMON" data/minecraft/damage_type/magic.json; unzip -p "$COMMON" data/minecraft/damage_type/indirect_magic.json
          echo "=== tags"; unzip -l "$COMMON" | grep -E "data/minecraft/tags/damage_type/" | head -80
          unzip -p "$COMMON" data/minecraft/tags/entity_type/can_breathe_under_water.json; unzip -p "$COMMON" data/minecraft/tags/entity_type/undead.json
          echo "=== death lang"; unzip -p "$COMMON" assets/minecraft/lang/en_us.json 2>/dev/null | grep -E "death.attack.(magic|indirectMagic|inFire|onFire)" 
          echo "=== honey bottle consumable usage"; javap -c -cp "$COMMON" net.minecraft.world.item.component.Consumables | grep -E "HONEY|DRINK|invoke" | head -40
      - name: Grapple APIs
        run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-clientOnly-deobf-26.3.jar' | head -1)
          echo "=== SynchedEntityData"; javap -cp "$COMMON" net.minecraft.network.syncher.SynchedEntityData | grep -E "defineId|public .* (get|set)\(" | head
          javap -cp "$COMMON" 'net.minecraft.network.syncher.SynchedEntityData$Builder' | head
          echo "=== EntityDataSerializers"; javap -cp "$COMMON" net.minecraft.network.syncher.EntityDataSerializers | grep -E " BOOLEAN| INT;" 
          echo "=== Entity bits"; javap -p -cp "$COMMON" net.minecraft.world.entity.Entity | grep -E "hurtMarked|defineSynchedData|resetFallDistance|fallDistance|isControlledByLocalInstance|LocalInstance|setDeltaMovement|addAdditionalSaveData|readAdditionalSaveData|markHurt" | head -20
          echo "=== Projectile"; javap -p -cp "$COMMON" net.minecraft.world.entity.projectile.Projectile | grep -E "onHit|getOwner|spawnProjectileFromRotation|shootFromRotation|canHitEntity" | head -20
          echo "=== ThrowableProjectile"; javap -p -cp "$COMMON" net.minecraft.world.entity.projectile.ThrowableProjectile | head -30
          echo "=== ThrowableItemProjectile"; javap -p -cp "$COMMON" net.minecraft.world.entity.projectile.ThrowableItemProjectile | head -30
          echo "=== Player cooldowns"; javap -cp "$COMMON" net.minecraft.world.item.ItemCooldowns | grep -E "addCooldown|isOnCooldown"
          echo "=== Boss"; javap -cp "$COMMON" net.minecraft.world.entity.Entity | grep -iE "boss|canBeHitByProjectile|isPickable" | head
          echo "=== EntityTypeTags boss"; javap -cp "$COMMON" net.minecraft.tags.EntityTypeTags | grep -iE "boss|immune" | head
          echo "=== EntityRenderState fields"; javap -p -cp "$CLIENT:$COMMON" net.minecraft.client.renderer.entity.state.EntityRenderState | grep -E "public .*;" | head -30
          echo "=== EntityRenderer extract"; javap -p -cp "$CLIENT:$COMMON" net.minecraft.client.renderer.entity.EntityRenderer | grep -E "extractRenderState|shouldRender|getRenderOffset" | head
          echo "=== Player hand"; javap -cp "$COMMON" net.minecraft.world.entity.player.Player | grep -iE "getRopeHoldPosition|getMainArm|isLocalPlayer" | head
          javap -cp "$COMMON" net.minecraft.world.entity.Entity | grep -iE "getRopeHoldPosition|getLeashOffset|getEyePosition" | head
      - name: Dye APIs
        run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          echo "=== Items DYE"; javap -cp "$COMMON" net.minecraft.world.item.Items | grep -iE "DYE" | head -40
          echo "=== dye item models"; unzip -l "$COMMON" | grep -iE "(items|recipe)/[a-z_]*dye[a-z_]*\.json" | head -40
          echo "=== a vanilla recipe using red dye"; for f in red_bed red_wool red_banner red_terracotta red_candle; do echo "-- $f"; unzip -p "$COMMON" data/minecraft/recipe/$f.json 2>/dev/null; unzip -p "$COMMON" data/minecraft/recipe/dye_$f.json 2>/dev/null; done
          echo "=== tags dye"; unzip -l "$COMMON" | grep -iE "tags/item/.*dye" | head
          for t in $(unzip -l "$COMMON" | grep -oE "data/minecraft/tags/item/[a-z_/]*dye[a-z_/]*\.json" | head -3); do echo "-- $t"; unzip -p "$COMMON" $t; done
          echo "=== DyeItem"; javap -cp "$COMMON" net.minecraft.world.item.DyeItem | head -20
          echo "=== DataComponents dye"; javap -cp "$COMMON" net.minecraft.core.component.DataComponents | grep -iE "DYE|COLOR" | head
