name: Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          set +e
          ./gradlew compileClientJava compileGametestJava --no-daemon > compile.txt 2>&1
          echo "exit $?"
          grep -E "error:" -A3 compile.txt | head -300
      - run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-client*deobf-26.3.jar' | head -1)
          FAPI=$(find ~/.gradle/caches -name 'fabric-*rendering-v1*.jar' | grep -v sources | head -3 | tr '\n' ':')
          FENT=$(find ~/.gradle/caches -name 'fabric-object-builder-api*.jar' | grep -v sources | head -2 | tr '\n' ':')
          CP="$CLIENT:$COMMON:$FAPI:$FENT"
          l() { echo "=== $1"; javap -cp "$CP" -p "$1" 2>&1 | grep -v 'lambda\$' | grep -iE "${2:-.}" | head -${3:-80}; }
          GT=$(find ~/.gradle/caches -name 'fabric-gametest-api-v1*.jar' | grep -v sources | head -2 | tr '\n' ':')
          CP="$CP:$GT"
          javap -cp "$CP" -p -c net.minecraft.world.entity.Mob | sed -n '/asValidTarget(net.minecraft.world.entity.LivingEntity);/,/^$/p' | head -60
          javap -cp "$CP" -p -c net.minecraft.world.entity.LivingEntity | sed -n '/public boolean canBeSeenByAnyone()/,/^$/p' | head -30
          javap -cp "$CP" -p -c net.minecraft.world.entity.Avatar | sed -n '/canBeSeenAsEnemy()/,/^$/p' | head -30
          javap -cp "$CP" -p net.minecraft.server.level.ServerPlayer | grep -iE 'invulnerable|canBeSeen|isSpectator' | head -20
