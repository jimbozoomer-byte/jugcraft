name: API probe
on:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve Minecraft
        run: ./gradlew compileJava --no-daemon -q
      - name: Dye APIs
        run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          echo "=== Items DYE"; javap -cp "$COMMON" net.minecraft.world.item.Items | grep -iE "DYE" | head -40
          echo "=== dye item models"; unzip -l "$COMMON" | grep -iE "(items|recipe)/[a-z_]*dye[a-z_]*\.json" | head -40
          echo "=== a vanilla recipe using red dye"; for f in red_bed red_wool red_banner red_terracotta red_candle; do echo "-- $f"; unzip -p "$COMMON" data/minecraft/recipe/$f.json 2>/dev/null; unzip -p "$COMMON" data/minecraft/recipe/dye_$f.json 2>/dev/null; done
          echo "=== tags dye"; unzip -l "$COMMON" | grep -iE "tags/item/.*dye" | head
          for t in $(unzip -l "$COMMON" | grep -oE "data/minecraft/tags/item/[a-z_/]*dye[a-z_/]*\.json" | head -3); do echo "-- $t"; unzip -p "$COMMON" $t; done
          echo "=== DyeItem"; javap -cp "$COMMON" net.minecraft.world.item.DyeItem | head -20
          echo "=== DataComponents dye"; javap -cp "$COMMON" net.minecraft.core.component.DataComponents | grep -iE "DYE|COLOR" | head
