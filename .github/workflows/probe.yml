name: Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          set +e
          ./gradlew compileClientJava compileGametestJava --no-daemon > compile.txt 2>&1
          echo "exit $?"
          grep -E "error:" -A3 compile.txt | head -300
      - run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-client*deobf-26.3.jar' | head -1)
          FAPI=$(find ~/.gradle/caches -name 'fabric-*rendering-v1*.jar' | grep -v sources | head -3 | tr '\n' ':')
          FENT=$(find ~/.gradle/caches -name 'fabric-object-builder-api*.jar' -o -name 'fabric-particles-v1*.jar' -o -name 'fabric-rendering-v1*.jar' | grep -v sources | tr '\n' ':')
          CP="$CLIENT:$COMMON:$FAPI:$FENT"
          l() { echo "=== $1"; javap -cp "$CP" -p "$1" 2>&1 | grep -v 'lambda\$' | grep -iE "${2:-.}" | head -${3:-80}; }
          GT=$(find ~/.gradle/caches -name 'fabric-gametest-api-v1*.jar' | grep -v sources | head -2 | tr '\n' ':')
          CP="$CP:$GT"
          l net.minecraft.world.level.block.BedBlock 'public|protected' 60
          l net.minecraft.world.item.BedItem 'public' 10
          l net.minecraft.world.level.block.entity.BaseContainerBlockEntity 'public|protected' 40
          l net.minecraft.world.Container 'startOpen|stopOpen|getEntitiesWithContainerOpen' 10
          l net.minecraft.world.inventory.ChestMenu 'public static' 10
          l net.minecraft.world.level.block.FaceAttachedHorizontalDirectionalBlock 'public|protected' 30
          l net.minecraft.client.particle.SingleQuadParticle 'public|protected' 50
          l net.minecraft.client.particle.TextureSheetParticle 'public|protected' 20
          l net.minecraft.client.particle.Particle 'protected|public' 70
          l net.minecraft.client.particle.ParticleProvider 'public' 10
          l net.minecraft.client.particle.SpriteSet 'public' 10
          l net.minecraft.core.particles.SimpleParticleType 'public' 10
          for c in $(echo "$FENT" | tr ':' '\n'); do unzip -l "$c" 2>/dev/null | grep -iE 'particle.*\.class' | head -20; done
          javap -cp "$CP" -p net.fabricmc.fabric.api.particle.v1.FabricParticleTypes 2>&1 | head -20
          javap -cp "$CP" -p net.fabricmc.fabric.api.client.particle.v1.ParticleFactoryRegistry 2>&1 | head -20
          javap -cp "$CP" -p net.fabricmc.fabric.api.client.particle.v1.ParticleProviderRegistry 2>&1 | head -20
          javap -cp "$CP" -p 'net.fabricmc.fabric.api.client.particle.v1.ParticleFactoryRegistry$PendingParticleFactory' 2>&1 | head -10
          javap -cp "$CP" -p 'net.fabricmc.fabric.api.client.particle.v1.ParticleProviderRegistry$PendingParticleProvider' 2>&1 | head -10
          l net.minecraft.client.particle.ParticleRenderType 'public static' 20
          l net.minecraft.world.level.block.LecternBlock 'useWithoutItem|useItemOn' 5
          l net.minecraft.world.entity.player.Player 'startSleepInBed|isSleeping' 5
          l net.minecraft.server.level.ServerPlayer 'startSleepInBed|setRespawnPosition|getRespawnConfig' 8
