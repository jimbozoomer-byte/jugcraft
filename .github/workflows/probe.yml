name: API probe (temporary, festival crops)
on:
  push:
    branches: ['claude/agriculture-festival-crops']
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve Minecraft
        run: ./gradlew compileJava --no-daemon -q
      - name: Fuel keys (6)
        run: |
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-client*deobf-26.3.jar' | head -1)
          CP="$CLIENT:$COMMON"
          FAPI=$(find ~/.gradle/caches -name 'fabric-*.jar' -path '*net.fabricmc.fabric-api*' | grep -v sources | tr '\n' ':')
          javap -cp "$CP" -p net.minecraft.world.level.storage.loot.providers.number.ints.ContextIntProviders | grep -E 'static final' | sed 's/.*> //'
          echo "=== Items OAK_LOG/OAK_PLANKS/OAK_SLAB fuel keys"; javap -cp "$CP" -c -p net.minecraft.world.item.Items | grep -E 'ContextIntProviders\.[A-Z_]*(FUEL|BURN)' | sed 's/.*Field //' | sort | uniq -c
          unzip -l "$COMMON" | awk '{print $4}' | grep -E 'data/minecraft/(block_transformer|context_int_provider|int_provider)' | head -20
          for c in net.fabricmc.fabric.api.item.v1.BlockTransformerHelper 'net.fabricmc.fabric.api.item.v1.BlockTransformerEvents$Modify' net.fabricmc.fabric.api.item.v1.BlockTransformerEvents; do echo "=== $c"; javap -cp "$CP:$FAPI" "$c" | head -20; done
