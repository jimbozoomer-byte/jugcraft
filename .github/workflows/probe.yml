name: Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          set +e
          ./gradlew compileClientJava compileGametestJava --no-daemon > compile.txt 2>&1
          echo "exit $?"
          grep -E "error:" -A3 compile.txt | head -300
      - run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-client*deobf-26.3.jar' | head -1)
          CP="$CLIENT:$COMMON"
          l() { echo "=== $1"; javap -cp "$CP" -p "$1" 2>&1 | grep -v 'lambda\$' | grep -iE "${2:-.}" | head -${3:-80}; }
          for f in data/minecraft/loot_table/entities/zombie.json data/minecraft/loot_table/entities/wither_skeleton.json data/minecraft/trade_set/wandering_trader/common.json data/minecraft/recipe/stone_slab_from_stonecutting.json; do echo "--- $f"; unzip -p "$COMMON" "$f"; echo; done
          mkdir -p vd && cd vd && unzip -q -o "$COMMON" 'data/minecraft/*' && grep -rl '"nbt"' data | head -10; grep -rh -B2 -A2 '"nbt"' data | head -40; cd ..
          unzip -l "$COMMON" | grep -iE "EntityPredicate|criterion/NbtPredicate" | awk '{print $4}' | head
          l net.minecraft.advancements.criterion.EntityPredicate 'nbt|record|public net' 20
          l net.minecraft.world.level.storage.loot.LootContext 'getRandom' 5
          l net.minecraft.client.renderer.SubmitNodeCollector 'submitText' 5
