name: API probe (temporary, Witching Season)
on:
  push:
    branches: ['claude/crypt-and-ossuary']
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve Minecraft
        run: ./gradlew compileClientJava --no-daemon -q
      - name: Batch 18 client APIs
        run: |
          set +e
          find ~/.gradle/caches -name 'minecraft-*26.3*.jar' | head
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-client*26.3*.jar' | grep -v common | head -1)
          echo "client: $CLIENT"
          CP="$CLIENT:$COMMON"
          l() { echo "=== $1 /${2:-.}/"; javap -cp "$CP" -p "$1" 2>&1 | grep -v 'lambda\$' | grep -iE "${2:-.}" | head -${3:-60}; }
          unzip -l "$CLIENT" | grep -iE "Equipment|ArmorModel|HumanoidArmor|HumanoidModel|ArmorStand|EntityModelSet|BlockEntityRendererProvider|SkullModel|ModelLayers" | awk '{print $4}' | head -40
          for c in $(unzip -l "$CLIENT" | grep -iE "layers/EquipmentLayerRenderer.class|HumanoidArmorLayer.class|ArmorModelSet.class|/EntityModelSet.class|BlockEntityRendererProvider\$Context.class|EquipmentClientInfo\$LayerType.class|renderer/entity/ArmorStandRenderer.class|state/ArmorStandRenderState.class|state/HumanoidRenderState.class|model/geom/ModelLayers.class|model/HumanoidModel.class|model/ArmorStandArmorModel.class|model/object/armorstand|SkeletonModel.class" | awk '{print $4}' | sed 's/\.class$//; s#/#.#g'); do
            echo "=== $c"; javap -cp "$CP" -p "$c" 2>&1 | grep -v 'lambda\$' | grep -iE "public|protected|static final" | grep -viE "lambda" | head -40
          done
