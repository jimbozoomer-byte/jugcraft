name: API probe
on:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve Minecraft
        run: ./gradlew compileJava --no-daemon -q
      - name: Party APIs
        run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-clientOnly-deobf-26.3.jar' | head -1)
          [ -z "$CLIENT" ] && CLIENT=$(find ~/.gradle/caches -name 'minecraft-*client*26.3*.jar' | head -1)
          echo "client jar: $CLIENT"
          echo "=== KeyMapping"; javap -cp "$CLIENT:$COMMON" net.minecraft.client.KeyMapping | head -40
          echo "=== KeyMapping.Category"; javap -cp "$CLIENT:$COMMON" 'net.minecraft.client.KeyMapping$Category' | head -30
          echo "=== ClickEvent"; javap -cp "$COMMON" net.minecraft.network.chat.ClickEvent | head; javap -cp "$COMMON" 'net.minecraft.network.chat.ClickEvent$RunCommand' | head
          echo "=== HoverEvent ShowText"; javap -cp "$COMMON" 'net.minecraft.network.chat.HoverEvent$ShowText' | head
          echo "=== Style click"; javap -cp "$COMMON" net.minecraft.network.chat.Style | grep -iE "click|hover|withColor|withBold" | head
          echo "=== MutableComponent"; javap -cp "$COMMON" net.minecraft.network.chat.MutableComponent | grep -iE "withStyle|append" | head
          echo "=== Fabric keybinding"; for j in $(find ~/.gradle/caches -name 'fabric-key*.jar' | head -3); do echo "-- $j"; unzip -l $j | grep -E "\.class" | head -10; done
          J=$(find ~/.gradle/caches -name 'fabric-key*.jar' | grep -v sources | head -1)
          for c in $(unzip -l $J | grep -oE "net/fabricmc/[A-Za-z0-9/]*\.class" | grep -v impl | sed 's/\.class//;s#/#.#g'); do javap -cp "$J:$CLIENT:$COMMON" $c; done
          echo "=== InputConstants"; javap -cp "$CLIENT:$COMMON" com.mojang.blaze3d.platform.InputConstants | grep -iE "KEY_P|Type" | head
          echo "=== ClientTickEvents"; J2=$(find ~/.gradle/caches -name 'fabric-lifecycle-events*.jar' | grep -v sources | head -1); javap -cp "$J2" net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents | head
          echo "=== EditBox"; javap -cp "$CLIENT:$COMMON" net.minecraft.client.gui.components.EditBox | grep -E "public .*(EditBox\(|getValue|setMaxLength|setHint)" | head
          echo "=== KeyMapping usages in vanilla Options"; javap -c -p -cp "$CLIENT:$COMMON" net.minecraft.client.Options | grep -iE "KeyMapping.\"<init>\"|Category" | head -10
      - name: Dye APIs
        run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          echo "=== Items DYE"; javap -cp "$COMMON" net.minecraft.world.item.Items | grep -iE "DYE" | head -40
          echo "=== dye item models"; unzip -l "$COMMON" | grep -iE "(items|recipe)/[a-z_]*dye[a-z_]*\.json" | head -40
          echo "=== a vanilla recipe using red dye"; for f in red_bed red_wool red_banner red_terracotta red_candle; do echo "-- $f"; unzip -p "$COMMON" data/minecraft/recipe/$f.json 2>/dev/null; unzip -p "$COMMON" data/minecraft/recipe/dye_$f.json 2>/dev/null; done
          echo "=== tags dye"; unzip -l "$COMMON" | grep -iE "tags/item/.*dye" | head
          for t in $(unzip -l "$COMMON" | grep -oE "data/minecraft/tags/item/[a-z_/]*dye[a-z_/]*\.json" | head -3); do echo "-- $t"; unzip -p "$COMMON" $t; done
          echo "=== DyeItem"; javap -cp "$COMMON" net.minecraft.world.item.DyeItem | head -20
          echo "=== DataComponents dye"; javap -cp "$COMMON" net.minecraft.core.component.DataComponents | grep -iE "DYE|COLOR" | head
