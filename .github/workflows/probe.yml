name: Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew compileJava --no-daemon -q
      - run: |
          set +e
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-client*deobf-26.3.jar' | head -1)
          CP="$CLIENT:$COMMON"
          p() { echo "=== $1"; javap -cp "$CP" -p "$1" 2>&1 | grep -v 'lambda\$' | head -${2:-80}; }
          p net.minecraft.util.LightCoordsUtil 40
          p net.minecraft.client.input.InputWithModifiers 40
          echo "=== Block dropFrom"; javap -cp "$CP" -p net.minecraft.world.level.block.Block | grep -iE 'dropFrom|popResourceFromFace'
          echo "=== BlockEntityRenderState.extractBase"; javap -cp "$CP" -p -c net.minecraft.client.renderer.blockentity.state.BlockEntityRenderState | grep -E 'invoke' | head -20
          echo "=== LevelRenderer light"; javap -cp "$CP" -p net.minecraft.client.renderer.LevelRenderer | grep -iE 'light' | head -20
          echo "=== Player mayUseItemAt"; javap -cp "$CP" -p net.minecraft.world.entity.player.Player | grep -iE 'mayUse|canUse' | head
          echo "=== ServerPlayer gameMode"; javap -cp "$CP" -p net.minecraft.server.level.ServerPlayer | grep -iE 'isCreative|isSpectator|gameMode\(' | head
          echo "=== BuiltInLootTables carve"; javap -cp "$CP" -p net.minecraft.world.level.storage.loot.BuiltInLootTables | grep -iE 'CARVE'
          echo "=== Codec byte buffer"; javap -cp "$CP" -p com.mojang.serialization.Codec | grep -iE 'BYTE' | head
          echo "=== ExtraCodecs bytes"; javap -cp "$CP" -p net.minecraft.util.ExtraCodecs | grep -iE 'byte|base64' | head
          mkdir -p /tmp/c && cd /tmp/c && unzip -q -o "$CLIENT" 'assets/minecraft/*'
          for f in items/light.json items/carved_pumpkin.json items/jack_o_lantern.json items/pumpkin.json items/bee_nest.json models/block/pumpkin.json models/block/carved_pumpkin.json models/block/jack_o_lantern.json models/block/orientable.json blockstates/carved_pumpkin.json blockstates/pumpkin.json; do echo "=== $f"; cat "assets/minecraft/$f"; echo; done
          ls assets/minecraft/textures/block | grep -iE 'pumpkin|lantern'
