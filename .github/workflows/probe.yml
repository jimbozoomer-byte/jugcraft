name: API probe (temporary, festival crops)
on:
  push:
    branches: ['claude/agriculture-festival-crops']
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve Minecraft
        run: ./gradlew compileJava --no-daemon -q
      - name: Stripping and fuel (3)
        run: |
          COMMON=$(find ~/.gradle/caches -name 'minecraft-common-deobf-26.3.jar' | head -1)
          CLIENT=$(find ~/.gradle/caches -name 'minecraft-client*deobf-26.3.jar' | head -1)
          CP="$CLIENT:$COMMON"
          FAPI=$(find ~/.gradle/caches -name 'fabric-*.jar' -path '*net.fabricmc.fabric-api*' | grep -v sources | tr '\n' ':')
          echo "=== fabric jars"; echo $FAPI | tr ':' '\n' | sed 's#.*/##' | sort | head -80
          echo "=== minecraft classes named Axe/Strip/Fuel/Weathering"; unzip -l "$COMMON" | awk '{print $4}' | grep -E '(Axe|Strip|Fuel|Flammab)[A-Za-z$]*\.class$' | head -40
          echo "=== minecraft data named strip"; unzip -l "$COMMON" | awk '{print $4}' | grep -iE 'strip|axe' | grep -v '\.class$' | head -40
          echo "=== fabric registry package"; for j in $(echo $FAPI | tr ':' ' '); do unzip -l "$j" | awk '{print $4}' | grep -E 'fabric/api/registry/' ; done | sort -u | head -60
          for c in $(unzip -l "$COMMON" | awk '{print $4}' | grep -E '/(AxeItem|[A-Za-z]*Strip[A-Za-z]*|FuelValues)\.class$' | sed 's/\.class$//; s#/#.#g'); do echo "=== $c"; javap -cp "$CP" -p "$c" | head -40; done
          echo "=== FuelValues bytecode tags"; javap -cp "$CP" -c -p net.minecraft.world.level.block.entity.FuelValues 2>/dev/null | grep -E 'ItemTags\.' | sed 's/.*Field //' | sort -u | head -30
          echo "=== WeightedList of"; javap -cp "$CP" -p net.minecraft.util.random.WeightedList | grep -E ' of\(' 
